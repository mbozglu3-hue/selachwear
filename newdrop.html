<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Selachwear New Drop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <img src="logo.webp" alt="Selachwear Logo" class="logo">

        <div>
            <a href="index.html">Ana Sayfa</a>
            <a href="index.html#koleksiyon">Koleksiyon</a>
        </div>
    </nav>

    <section class="product-detail">

  <div class="product-detail-image" id="productImage">
    <img id="frontImage" src="thsirt2.png" alt="T-Shirt ön">
    <img id="backImage" src="tshirt2.jpeg" alt="T-Shirt arka">
</div>
        <div class="product-center">
            <p>SELACHWEAR</p>
            <span>NEW COLLECTION</span>
        </div>

        <div class="product-info">
            <h1>Selachwear T-Shirt</h1>

            <p class="price">600 TL</p>

            <p>
                Selachwear yeni koleksiyonundan
                sade ve modern tasarıma sahip T-Shirt.
            </p>

            <p class="sizes">
                S &nbsp; M &nbsp; L &nbsp; XL
            </p>

            <a href="https://www.shopier.com/selachwear"
               class="shop-button"
               target="_blank">
                Shopier'de Satın Al
            </a>
        </div>
        </section>
        </div>
    </section>

<script>
const productImage = document.getElementById("productImage");
const frontImage = document.getElementById("frontImage");
const backImage = document.getElementById("backImage");

productImage.addEventListener("touchend", function (e) {
    e.preventDefault();

    if (backImage.style.display === "block") {
        backImage.style.display = "none";
        backImage.style.opacity = "0";

        frontImage.style.display = "block";
        frontImage.style.opacity = "1";
    } else {
        frontImage.style.display = "none";

        backImage.style.display = "block";
        backImage.style.opacity = "1";
    }
});
</script>
</body>
</html>
